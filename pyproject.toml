[project]
name = "jax-ffi-gen"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "tree_sitter",
    "tree_sitter_cuda"
]
description = "Scripts to auto-generate jax's foreign function interface from CUDA kernels"
authors = [
    { name="Jens Stücker", email="jens.stuecker@univie.ac.at" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/jstuecker/jax_ffi_gen"
Issues = "https://github.com/jstuecker/jax_ffi_gen/issues"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"
